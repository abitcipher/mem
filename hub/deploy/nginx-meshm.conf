# Host nginx site for the MEM hub (hub/deploy/README.md). Install as
# /etc/nginx/sites-available/meshm.artcomplect.com; `certbot --nginx -d meshm.artcomplect.com`
# then adds the HTTPS server block and the redirect.
server {
    server_name meshm.artcomplect.com;
    listen 80;
    listen [::]:80;

    # Only the hub's two paths; nothing else is served.
    location = /v1 {
        proxy_pass http://127.0.0.1:4111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Phones keep the socket open and idle between messages.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Largest hub message (1 MiB plus headers).
        client_max_body_size 2m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4111;
    }

    location / {
        return 404;
    }

    # No request logs with addresses for the hub (the hub keeps no client logs).
    access_log off;
}
