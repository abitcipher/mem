[package]
name = "cla-hub"
description = "Hub channel client: one WebSocket to the MEM hub carrying CBOR hub messages, with reconnects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mem-proto.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
tracing.workspace = true
mem-crypto = { workspace = true, optional = true }

[features]
# An in-process hub following `spec/hub.cddl`, for tests of this crate and of mem-runtime.
test-hub = ["dep:mem-crypto"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }

[[test]]
name = "client"
required-features = ["test-hub"]
