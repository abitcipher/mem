# cargo-deny configuration.
# Every new dependency must pass `cargo deny check` and be justified in its PR.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` (proc-macro, build time only) is archived but has no known vulnerability. Pulled in
    # by netlink-packet-core ← netwatch ← iroh; no maintained alternative upstream.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro via iroh; no vulnerability" },
    # `pin-utils` is archived but has no known vulnerability. Pulled in by async-imap (email
    # channel); no maintained alternative upstream.
    { id = "RUSTSEC-2026-0441", reason = "unmaintained helper macros via async-imap; no vulnerability" },
    # SQLite before 3.54.0 can return stale memory when it opens a database with a crafted
    # `-wal` file written by someone else. The only database here is the courier store, which
    # the app creates itself in its private directory and never imports from outside. No
    # SQLCipher release bundles a fixed SQLite yet (rusqlite 0.41 with `bundled-sqlcipher` still
    # ships 3.53.4), so upgrading would only hide the finding. Remove when one does.
    { id = "RUSTSEC-2026-0459", reason = "not reachable: only self-created private database files are opened; no fixed SQLCipher release yet" },
]

[licenses]
version = 2
# Permissive licenses only. AGPL/GPL are forbidden in core crates;
# additions to this list need a PR justification.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

# Narrow, per-crate exceptions for permissive licenses outside the allowlist.
[[licenses.exceptions]]
# BlueOak-1.0.0: permissive, OSI-approved, patent grant. minicbor is the wire codec.
crate = "minicbor"
allow = ["BlueOak-1.0.0"]

[[licenses.exceptions]]
# Same author and license as minicbor; serde bridge used for the local state snapshot.
crate = "minicbor-serde"
allow = ["BlueOak-1.0.0"]

[[licenses.exceptions]]
# 0BSD (public-domain-equivalent): lettre's quoted-printable encoder, for the email bridge.
crate = "quoted_printable"
allow = ["0BSD"]

[[licenses.exceptions]]
# Mozilla's CA root list as data (CDLA-Permissive-2.0: permissive data licence). Pulled in by
# iroh-relay / reqwest; MEM disables relays but the crates are still linked.
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
# Public-domain dedication; wasm32-only transitive deps of iroh's browser transport.
crate = "async_io_stream"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "pharos"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "ws_stream_wasm"
allow = ["Unlicense"]

[licenses.private]
# Workspace crates are unpublished and source-available (LICENSE.md), not under an allowlisted license.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # intra-workspace path deps of unpublished crates
highlight = "all"
deny = [
    # AGPL; study the design, never link it.
    { crate = "libqaul", reason = "AGPL-3.0, forbidden in the core crates" },
    # Heavy native deps need a recorded design decision first.
    { crate = "opencv", reason = "forbidden without a recorded design decision" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
