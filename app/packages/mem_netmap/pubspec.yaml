name: mem_netmap
description: "A map of one device's connections: nodes on rings around a centre, links styled one by one with glow and moving dots, traffic pulses, tap and drag-to-connect. Knows nothing of MEM."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
