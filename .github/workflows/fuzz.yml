name: Fuzz (nightly)

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [bundle_decode, cbor_scan]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - working-directory: fuzz
        run: |
          mkdir -p "corpus/${{ matrix.target }}"
          seeds="seeds/${{ matrix.target }}"; [ -d "$seeds" ] || seeds=""
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            "corpus/${{ matrix.target }}" $seeds -- -max_total_time=1800
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
