[workspace]
resolver = "3"
members = [
    "crates/mem-proto",
    "crates/mem-crypto",
    "crates/mem-core",
    "crates/mem-store",
    "crates/mem-runtime",
    "crates/mem-fountain",
    "crates/mem-cla",
    "crates/cla-qr",
    "crates/cla-audio",
    "crates/cla-iroh",
    "crates/cla-ble",
    "crates/cla-hub",
    "crates/cla-email",
    "crates/mem-sim",
    "crates/mem-ffi",
    "crates/mem-hublist",
    "tests/invariants",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://example.invalid/mem" # placeholder
# License intentionally unset until one is chosen.
publish = false

[workspace.dependencies]
mem-proto = { path = "crates/mem-proto" }
mem-crypto = { path = "crates/mem-crypto" }
mem-core = { path = "crates/mem-core" }
mem-store = { path = "crates/mem-store" }
mem-runtime = { path = "crates/mem-runtime" }
mem-fountain = { path = "crates/mem-fountain" }
mem-cla = { path = "crates/mem-cla" }
cla-qr = { path = "crates/cla-qr" }
cla-audio = { path = "crates/cla-audio" }
cla-iroh = { path = "crates/cla-iroh" }
cla-ble = { path = "crates/cla-ble" }
cla-hub = { path = "crates/cla-hub" }
cla-email = { path = "crates/cla-email" }

# Third-party (each justified in the PR that added it; checked by `cargo deny`).
minicbor = { version = "2.3.0", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.21", default-features = false }
proptest = "1.12.0"
hex = "0.4.3"
# Cryptography. All share rand_core 0.10; randomness is always injected.
# `zeroize` wherever a crate offers it, so key copies inside the crates are wiped too.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "x25519", "chacha", "mlkem"] }
blake3 = { version = "1.8.7", default-features = false, features = ["zeroize"] }
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
sha2 = { version = "0.11.1", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
bip39 = { version = "3.0.0", default-features = false }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc", "derive"] }
subtle = { version = "2.6.1", default-features = false }
rand_core = "0.10.1"
rand_chacha = "0.10.0"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
minicbor-serde = { version = "0.7.1", default-features = false, features = ["alloc"] }
data-encoding = { version = "2.11.1", default-features = false, features = ["alloc"] }
raptorq = { version = "2.0.1", default-features = false }
# Networking (cla-iroh, mem-runtime). Iroh is pinned exactly. Default
# features off: no n0 DNS discovery, no public relays, no UPnP/NAT-PMP port mapping.
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "=0.6.0"
n0-future = "0.3.2"
tokio = { version = "1.53.3", features = ["rt", "sync", "time"] }
# Hub client (cla-hub): WebSocket over rustls with the Mozilla root store, the same TLS
# stack and roots Iroh already brings in.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
rxing = { version = "0.9.3", default-features = false, features = ["qrcode", "decoders", "encoding_rs"] }

[workspace.lints.rust]
unsafe_code = "deny" # proto/crypto/core/store additionally `#![forbid(unsafe_code)]`
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# Argon2id is far too slow unoptimised; keep tests and debug builds usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
