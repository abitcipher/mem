[package]
name = "mem-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Kept out of the main workspace: needs nightly and libFuzzer.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
mem-proto = { path = "../crates/mem-proto" }
